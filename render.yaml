services:
    - type: web
      name: gym-project-service
      env: python
      plan: free
      buildCommand: pip install -r requirements.txt
      startCommand: gunicorn gym.wsgi
      envVars:
        - key: PYTHON_VERSION
          value: 3.10.5
        - key: SECRET_KEY
          generateValue: true
        - key: DEBUG
          value: 'False'